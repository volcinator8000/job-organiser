name: Sync & remind

# Runs when the web app pushes a new vault, and every morning for reminders.
on:
  push:
    branches: [main]
    paths: [data/jobs.vault]
  schedule:
    - cron: "0 7 * * *"   # 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      TZ: ${{ vars.TZ || 'UTC' }}
      JOBVAULT_PASSWORD: ${{ secrets.JOBVAULT_PASSWORD }}
      GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
      SHEET_ID: ${{ secrets.SHEET_ID }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: ${{ secrets.SMTP_PORT }}
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      REMIND_TO: ${{ secrets.REMIND_TO }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: python/requirements.txt
      - run: pip install -r python/requirements.txt
      # Logs of public repos are public: sync.py only prints counts.
      - name: Sync to Google Sheets
        run: python python/sync.py --sheets
      - name: Email due follow-ups
        if: github.event_name != 'push'
        run: python python/sync.py --remind
